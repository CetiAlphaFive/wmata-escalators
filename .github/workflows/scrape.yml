name: scrape

on:
  schedule:
    # Backstop only: each run takes ~5 hourly snapshots and dispatches the next
    # run itself (scripts/scrape_loop.sh). This restarts the relay if a hand-off
    # is ever lost. Off minute 0, where GitHub's scheduler is busiest.
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      budget_seconds:
        description: "How long this run keeps looping (blank = 5.5 h). A short value tests the hand-off."
        required: false
        default: ""

permissions:
  contents: write
  actions: write   # the relay dispatches its own next run

# Exactly one relay at a time. A run queued behind it (the hand-off or a backstop
# cron) waits; the newest queued run replaces any older one, so the run history
# shows some "cancelled" backstop runs. That is expected.
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5

      - name: Scrape every hour, then hand off to the next run
        env:
          WMATA_API_KEY: ${{ secrets.WMATA_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          BUDGET_SECONDS: ${{ inputs.budget_seconds }}
        run: ./scripts/scrape_loop.sh
